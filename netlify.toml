[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Temporary maintenance mode: avoid caching the pause page so the site can come back cleanly.
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/assets/product-photos/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  # Temporary maintenance mode. Remove this block to reopen the full site.
  from = "/*"
  to = "/maintenance.html"
  status = 200
  force = true

[[redirects]]
  from = "/patterns"
  to = "/index.html#library"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/index.html#gallery"
  status = 301
