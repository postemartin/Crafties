<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Finished braided yarn friendship bracelet with lavender cream and teal yarn on a warm craft table">
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7e7"/>
      <stop offset="48%" stop-color="#f3d8ad"/>
      <stop offset="100%" stop-color="#c99865"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="45%" stop-color="#fff6da" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#a56c47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f7ead1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4b224d" flood-opacity="0.22"/>
    </filter>
    <filter id="strandShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4b224d" flood-opacity="0.24"/>
    </filter>
    <pattern id="woodgrain" width="220" height="90" patternUnits="userSpaceOnUse">
      <path d="M-20 35 C60 15 120 62 240 28" fill="none" stroke="#b67b4e" stroke-opacity="0.20" stroke-width="5"/>
      <path d="M-10 72 C52 52 122 98 230 66" fill="none" stroke="#8d5b3f" stroke-opacity="0.14" stroke-width="3"/>
      <path d="M20 5 C88 22 132 -8 210 12" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
    </pattern>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfc9ff"/><stop offset="0.5" stop-color="#a883dd"/><stop offset="1" stop-color="#7b55b7"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbed"/><stop offset="0.55" stop-color="#ead9b4"/><stop offset="1" stop-color="#c2a06d"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4fff1"/><stop offset="0.5" stop-color="#58d3bc"/><stop offset="1" stop-color="#168a7e"/></linearGradient>
    <linearGradient id="scissor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#9aa8b5"/></linearGradient>
  </defs>

  <rect width="1200" height="1200" rx="52" fill="url(#table)"/>
  <rect width="1200" height="1200" rx="52" fill="url(#woodgrain)" opacity="0.75"/>
  <rect width="1200" height="1200" rx="52" fill="url(#glow)"/>

  <g transform="translate(112 118) rotate(-5)" filter="url(#softShadow)" opacity="0.92">
    <rect x="0" y="0" width="390" height="220" rx="28" fill="url(#paper)"/>
    <line x1="48" y1="62" x2="330" y2="62" stroke="#e8c9aa" stroke-width="10" stroke-linecap="round"/>
    <line x1="48" y1="108" x2="286" y2="108" stroke="#ecd6bd" stroke-width="10" stroke-linecap="round"/>
    <line x1="48" y1="154" x2="242" y2="154" stroke="#ecd6bd" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g transform="translate(865 130) rotate(14)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="78" fill="#dfc9ff" stroke="#fff" stroke-width="16"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#b48ee8" stroke-width="22" opacity="0.9"/>
    <path d="M-55 -12 C-20 -44 30 -38 55 -2" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(1005 255) rotate(-9)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="70" fill="#b9f6e9" stroke="#fff" stroke-width="15"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#4fcbb7" stroke-width="19" opacity="0.9"/>
    <path d="M-46 -8 C-16 -34 28 -29 48 0" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(730 820) rotate(-18)" filter="url(#softShadow)">
    <rect x="0" y="0" width="320" height="54" rx="13" fill="#f4e7c7" stroke="#a8754f" stroke-width="4"/>
    <g stroke="#9a6b4d" stroke-width="3" opacity="0.75">
      <line x1="34" y1="6" x2="34" y2="48"/><line x1="68" y1="6" x2="68" y2="34"/><line x1="102" y1="6" x2="102" y2="48"/><line x1="136" y1="6" x2="136" y2="34"/><line x1="170" y1="6" x2="170" y2="48"/><line x1="204" y1="6" x2="204" y2="34"/><line x1="238" y1="6" x2="238" y2="48"/><line x1="272" y1="6" x2="272" y2="34"/>
    </g>
  </g>

  <g transform="translate(210 790) rotate(22)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#7c8b98" stroke-width="13"/>
    <circle cx="55" cy="-14" r="40" fill="none" stroke="#7c8b98" stroke-width="13"/>
    <path d="M23 -2 L220 -80" stroke="url(#scissor)" stroke-width="18" stroke-linecap="round"/>
    <path d="M26 8 L225 58" stroke="url(#scissor)" stroke-width="18" stroke-linecap="round"/>
    <path d="M200 -88 L280 -118 L222 -52Z" fill="#dce3ea" stroke="#7c8b98" stroke-width="5"/>
    <path d="M205 53 L286 78 L222 22Z" fill="#dce3ea" stroke="#7c8b98" stroke-width="5"/>
  </g>

  <g transform="translate(0 10)" filter="url(#strandShadow)">
    <!-- loose tie ends left -->
    <path d="M135 640 C238 578 334 576 430 612" fill="none" stroke="url(#lavender)" stroke-width="26" stroke-linecap="round"/>
    <path d="M132 675 C242 629 326 622 430 640" fill="none" stroke="url(#cream)" stroke-width="26" stroke-linecap="round"/>
    <path d="M142 710 C246 680 335 670 430 670" fill="none" stroke="url(#teal)" stroke-width="26" stroke-linecap="round"/>

    <!-- left knot -->
    <ellipse cx="438" cy="640" rx="48" ry="36" fill="#b694e6" stroke="#fff" stroke-width="8" transform="rotate(10 438 640)"/>
    <path d="M408 621 C436 652 462 656 488 626" fill="none" stroke="#6e48a6" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>

    <!-- braided bracelet body, interwoven blocks -->
    <path d="M475 640 C520 560 590 560 640 640 S760 720 812 640 S918 560 972 640" fill="none" stroke="url(#lavender)" stroke-width="46" stroke-linecap="round"/>
    <path d="M475 640 C528 718 590 718 640 640 S760 560 812 640 S920 718 972 640" fill="none" stroke="url(#teal)" stroke-width="46" stroke-linecap="round"/>
    <path d="M486 620 C560 646 610 668 662 640 S750 612 804 640 S900 666 962 620" fill="none" stroke="url(#cream)" stroke-width="40" stroke-linecap="round"/>

    <!-- highlight fibers -->
    <g fill="none" stroke="#fff" stroke-opacity="0.48" stroke-linecap="round">
      <path d="M486 618 C536 571 593 581 627 625" stroke-width="6"/>
      <path d="M651 658 C715 694 766 687 800 646" stroke-width="6"/>
      <path d="M818 624 C876 577 924 590 958 632" stroke-width="6"/>
      <path d="M492 664 C548 704 597 696 632 650" stroke-width="5"/>
      <path d="M650 620 C704 584 759 586 800 627" stroke-width="5"/>
    </g>

    <!-- right knot and tie ends -->
    <ellipse cx="992" cy="640" rx="48" ry="36" fill="#58d3bc" stroke="#fff" stroke-width="8" transform="rotate(-8 992 640)"/>
    <path d="M964 661 C994 630 1020 629 1048 658" fill="none" stroke="#116f66" stroke-opacity="0.42" stroke-width="8" stroke-linecap="round"/>
    <path d="M1035 612 C1124 573 1160 540 1184 486" fill="none" stroke="url(#lavender)" stroke-width="24" stroke-linecap="round"/>
    <path d="M1036 642 C1130 634 1170 656 1198 704" fill="none" stroke="url(#cream)" stroke-width="24" stroke-linecap="round"/>
    <path d="M1030 674 C1118 700 1158 747 1183 806" fill="none" stroke="url(#teal)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <g opacity="0.78">
    <circle cx="178" cy="506" r="9" fill="#fff65c"/>
    <circle cx="1016" cy="510" r="8" fill="#fff"/>
    <circle cx="1080" cy="445" r="6" fill="#ff4fa3"/>
    <circle cx="345" cy="870" r="7" fill="#22d7a5"/>
  </g>
</svg>
