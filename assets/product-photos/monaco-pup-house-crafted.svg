      <stop offset="100%" stop-color="#edd0ab"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd977"/>
      <stop offset="50%" stop-color="#d2a63d"/>
      <stop offset="100%" stop-color="#f4d27d"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b1014"/>
      <stop offset="100%" stop-color="#23070b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#5e3421" flood-opacity="0.25"/>
    </filter>
    <filter id="blurSmall">
