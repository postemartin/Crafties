    </filter>
    <pattern id="yarnRed" width="26" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 12 C7 3, 19 3, 24 12" fill="none" stroke="#f35c55" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
      <path d="M2 12 C7 21, 19 21, 24 12" fill="none" stroke="#7f0d12" stroke-width="2.4" stroke-linecap="round" opacity="0.28"/>
    </pattern>
    <pattern id="yarnBlack" width="22" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 9 C6 2, 16 2, 20 9" fill="none" stroke="#666" stroke-width="2.1" stroke-linecap="round" opacity="0.22"/>
      <path d="M2 9 C6 16, 16 16, 20 9" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" opacity="0.22"/>
    </pattern>
    <pattern id="yarnCream" width="24" height="20" patternUnits="userSpaceOnUse">
      <path d="M2 10 C7 2, 17 2, 22 10" fill="none" stroke="#fffaf1" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>
