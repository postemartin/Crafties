<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
  <title id="title">Monaco Pup House crochet hero image</title>
  <desc id="desc">A warm Team Crafties style illustration of the Monaco Pup House: a handmade crochet dog house with red walls, black roof, cream doorway trim, gold edging, and a cozy cushion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f3ed"/>
      <stop offset="60%" stop-color="#efe4d8"/>
      <stop offset="100%" stop-color="#ead8c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fff6eb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff6eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d3b296"/>
      <stop offset="100%" stop-color="#b98f72"/>
    </linearGradient>
    <linearGradient id="houseRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8272d"/>
      <stop offset="100%" stop-color="#aa0f16"/>
